name: Verify PRs

on:
  # `edited` matters here — this workflow checks the title, so it has to rerun
  # when the title changes.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Declared per job rather than at the workflow level, so the labeller's
# pull-requests: write is not sitting under a narrower workflow-level block.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads the title from the event payload; never touches the API.
    permissions: {}
    steps:
      - name: Check PR Title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR title: $PR_TITLE"

          # Define valid types
          VALID_TYPES="feat|fix|bug|docs|test|ci|refactor|perf|chore|revert|release"

          # Regular expression pattern for PR title validation
          if ! [[ "$PR_TITLE" =~ ^($VALID_TYPES):[[:space:]]\[(DRO-[0-9]+(,[[:space:]]*DRO-[0-9]+)*)\][[:space:]][A-Z].* ]]; then
            echo "::error::PR title does not match the required pattern!"
            echo "::error::Required format: <type>: [<issue-number>] <title>"
            echo "::error::Where:"
            echo "::error::- type: Must be one of: feat, fix, bug, docs, test, ci, refactor, perf, chore, revert, release"
            echo "::error::- issue-number: Must be DRO-X or multiple like [DRO-1, DRO-2]"
            echo "::error::- title: Must start with a capital letter"
            echo "::error::"
            echo "::error::Valid examples:"
            echo "::error::- feat: [DRO-1] Implement user authentication"
            echo "::error::- fix: [DRO-42] Fix memory leak in notification service"
            echo "::error::- docs: [DRO-7, DRO-8] Update API documentation"
            echo "::error::- ci: [DRO-15] Add performance testing to pipeline"
            echo "::error::- refactor: [DRO-20] Refactor code for better readability"
            echo "::error::- perf: [DRO-30] Improve performance of data processing"
            echo "::error::- chore: [DRO-40] Update dependencies"
            echo "::error::- revert: [DRO-50] Revert changes from DRO-10"
            echo "::error::- release: [DRO-60] Prepare for release"
            echo "::error::"
            echo "::error::Your title: \"$PR_TITLE\""
            exit 1
          else
            echo "✅ PR title format is valid!"
          fi

  label-merge-conflicts:
    name: Has Conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # to add the label and comment
    steps:
      - name: Check for Merge Conflicts
        # Pinned to a commit rather than a tag: a mutable tag on a third-party
        # action is a supply-chain hole, since whoever controls the repository
        # can repoint v3 at new code that runs with this token.
        # v3.0.4 — bump the comment and the SHA together.
        uses: prince-chrismc/label-merge-conflicts-action@21e6705eaa6aab66e4e486279389c8e3e4c465b7 # v3.0.4
        # A PR from a fork gets a read-only token, so labelling cannot work
        # there. That should not show up as a failed check on a contributor's
        # first PR.
        continue-on-error: true
        with:
          conflict_label_name: "conflicts"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          conflict_comment: |
            :wave: Hi, @${{ github.actor }},
            I detected conflicts against the base branch :speak_no_evil:
            You'll want to sync :arrows_counterclockwise: your branch with upstream!
